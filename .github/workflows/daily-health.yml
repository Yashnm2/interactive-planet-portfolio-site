name: Daily repository health

on:
  schedule:
    # 00:15 Asia/Singapore (UTC+8)
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-repository-health
  cancel-in-progress: false

jobs:
  select-check-count:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - name: Select weighted daily check count
        id: select
        shell: bash
        run: |
          roll="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          roll="$((roll % 100))"

          # Weighted distribution:
          # 1: 5%, 2: 20%, 3: 40%, 4: 20%, 5: 10%, 6: 5%
          if (( roll < 5 )); then
            count=1
          elif (( roll < 25 )); then
            count=2
          elif (( roll < 65 )); then
            count=3
          elif (( roll < 85 )); then
            count=4
          elif (( roll < 95 )); then
            count=5
          else
            count=6
          fi

          matrix_items="$(seq 1 "${count}" | paste -sd, -)"
          echo "Selected ${count} health checks (roll: ${roll})."
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "matrix=[${matrix_items}]" >> "${GITHUB_OUTPUT}"

  health-check:
    needs: select-check-count
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        check: ${{ fromJSON(needs.select-check-count.outputs.matrix) }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  record-health:
    needs:
      - select-check-count
      - health-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Record successful health check
        id: health-log
        shell: bash
        env:
          CHECK_COUNT: ${{ needs.select-check-count.outputs.count }}
        run: |
          health_date="$(TZ=Asia/Singapore date +%F)"
          entry="- healthy ${health_date} (${CHECK_COUNT} checks)"

          if grep -Eq -- "^- healthy ${health_date}( |$)" HEALTH.md; then
            echo "No new health entry is needed for ${health_date}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${entry}" >> HEALTH.md
            echo "Added health entry for ${health_date}."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "date=${health_date}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push health log
        if: steps.health-log.outputs.changed == 'true'
        shell: bash
        env:
          HEALTH_DATE: ${{ steps.health-log.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEALTH.md
          git commit -m "chore: record healthy status for ${HEALTH_DATE}"
          git push origin HEAD:main
